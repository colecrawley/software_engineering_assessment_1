services:
  robot_sim:
    image: ghcr.io/francescodelduchetto/cmp9134_2526_robotsim:latest
    ports:
      - "5000:5000"
    networks:
      - robot_network

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: robot_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - robot_network

  redis:
    image: redis:7-alpine
    networks:
      - robot_network

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      ROBOT_API_URL: http://robot_sim:5000
      ROBOT_WS_URL: ws://robot_sim:5000/ws/telemetry
      DATABASE_URL: postgresql://postgres:password@db:5432/robot_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - robot_sim
      - db
      - redis
    networks:
      - robot_network
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - robot_network

networks:
  robot_network:
    driver: bridge

volumes:
  postgres_data:
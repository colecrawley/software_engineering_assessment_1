<!DOCTYPE html>
<html>
<head>
    <title>Robot Management System</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: Arial, sans-serif; padding: 20px; }
        .container { max-width: 1400px; margin: auto; }
        .card { background: #2d2d2d; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        button { background: #00bcd4; color: black; padding: 10px 20px; border: none; cursor: pointer; margin: 5px; border-radius: 4px; font-weight: bold; }
        button.danger { background: #f44336; color: white; }
        button.logout { background: #555; color: white; }
        button.history { background: #9c27b0; color: white; }
        input, select { padding: 8px; margin: 5px; background: #333; color: white; border: 1px solid #555; border-radius: 4px; }
        pre { background: #1e1e1e; padding: 10px; border-radius: 5px; overflow-x: auto; }
        .status-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .connected { background: #4caf50; }
        .disconnected { background: #f44336; }
        .error { background: #ff9800; }
        .map-container { position: relative; width: 420px; height: 420px; margin: 0 auto; background: #000; border: 2px solid #444; }
        .map-row { display: flex; }
        .map-cell { width: 20px; height: 20px; border: 1px solid #333; box-sizing: border-box; }
        .obstacle { background: #8B4513; }
        .robot { background: #00bcd4; border-radius: 50%; box-shadow: 0 0 5px #00bcd4; position: relative; z-index: 2; }
        .charging { background: #4caf50; }
        .status-message { font-weight: bold; margin-top: 10px; }
        .moving { color: #ff9800; }
        .stuck { color: #f44336; }
        .idle { color: #4caf50; }
        .user-info { display: flex; justify-content: flex-end; align-items: center; gap: 15px; margin-bottom: 10px; }
        .username { font-weight: bold; color: #00bcd4; }
        .battery-warning { background: #f44336; color: white; padding: 10px; border-radius: 5px; margin-top: 10px; text-align: center; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); }
        .modal-content { background: #2d2d2d; margin: 10% auto; padding: 20px; width: 80%; max-width: 800px; border-radius: 8px; max-height: 70vh; overflow-y: auto; }
        .modal-content table { width: 100%; border-collapse: collapse; }
        .modal-content th, .modal-content td { border: 1px solid #555; padding: 8px; text-align: left; }
        .modal-content th { background: #444; }
        .close { color: white; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>Robot Ground Control Station</h1>
            <div id="userInfo" class="user-info" style="display: none;">
                <span>Logged in as: <span id="displayUsername" class="username"></span> (<span id="displayRole"></span>)</span>
                <button id="historyBtn" class="history">Command History</button>
                <button id="logoutBtn" class="logout">Logout</button>
            </div>
        </div>
        <div id="authStatus" style="margin-bottom: 10px;"></div>
    </div>

    <div class="grid-2">
        <div class="card">
            <h2>Robot Status</h2>
            <div id="statusDisplay">Loading...</div>
            <button id="refreshBtn">Refresh Status</button>
            <button id="resetBtn" class="danger">Reset Robot</button>
        </div>
        <div class="card">
            <h2>Control</h2>
            <div id="roleWarning" style="color: #ff9800; margin-bottom: 10px;"></div>
            <div>
                <label>X (0-20): </label>
                <input type="number" id="x" min="0" max="20" placeholder="0-20">
            </div>
            <div>
                <label>Y (0-20): </label>
                <input type="number" id="y" min="0" max="20" placeholder="0-20">
            </div>
            <button id="moveBtn">Move Robot</button>
            <div id="moveFeedback"></div>
        </div>
    </div>

    <div class="card">
        <h2>Grid Map (21x21)</h2>
        <div id="mapContainer" class="map-container"></div>
        <div id="batteryAlert"></div>
        <p class="status-message" id="robotStatusMsg"></p>
        <p><small>Brown = obstacle | Blue = robot | Green = charging station (0,0)</small></p>
    </div>

    <div class="card" id="authPanel">
        <h2>Authentication</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <select id="regRole">
            <option value="viewer">Viewer</option>
            <option value="commander">Commander</option>
        </select>
        <button id="loginBtn">Login</button>
        <button id="registerBtn">Register</button>
        <div id="authMessage"></div>
    </div>
</div>

<!-- cmd history -->
<div id="historyModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Command History</h2>
        <table id="historyTable">
            <thead>
                <table><th>Timestamp</th><th>User</th><th>Command</th><th>Details</th><th>Success</th></tr>
            </thead>
            <tbody id="historyBody"></tbody>
        </table>
    </div>
</div>

<script>
    const API = 'http://localhost:8000/api';
    const WS_URL = 'ws://localhost:8000/ws/telemetry';
    let token = localStorage.getItem('token');
    let robotData = null;
    let mapData = null;
    let webSocket = null;
    let currentUser = null;

    // helper for api call
    async function apiCall(endpoint, options = {}) {
        const headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = `Bearer ${token}`;
        const res = await fetch(API + endpoint, { ...options, headers, mode: 'cors' });
        if (!res.ok) throw new Error(await res.text());
        return res.json();
    }

    // get map once
    async function fetchMap() {
        if (!token) return;
        try {
            mapData = await apiCall('/robot/map');
            drawMap();
        } catch (err) { console.error('Map fetch error:', err); }
    }

    // draw grid
    function drawMap() {
        const container = document.getElementById('mapContainer');
        if (!container || !mapData || !robotData) return;
        const width = mapData.width, height = mapData.height, grid = mapData.grid;
        container.innerHTML = '';
        for (let y = 0; y < height; y++) {
            const row = document.createElement('div'); row.className = 'map-row';
            for (let x = 0; x < width; x++) {
                const cell = document.createElement('div'); cell.className = 'map-cell';
                if (grid[y] && grid[y][x] === 1) cell.classList.add('obstacle');
                if (robotData.position && robotData.position.x === x && robotData.position.y === y) cell.classList.add('robot');
                if (x === 0 && y === 0 && (!robotData.position || robotData.position.x !== 0 || robotData.position.y !== 0)) {
                    cell.style.backgroundColor = '#4caf50'; cell.style.opacity = '0.5';
                }
                row.appendChild(cell);
            }
            container.appendChild(row);
        }
    }

    // update ui
    function updateUI() {
        if (!robotData) return;
        const statusDiv = document.getElementById('statusDisplay');
        const battery = robotData.battery;
        const batteryColor = battery < 20 ? 'red' : (battery < 50 ? 'orange' : 'green');
        statusDiv.innerHTML = `
            <p><strong>ID:</strong> ${robotData.id}</p>
            <p><strong>Position:</strong> (${robotData.position.x}, ${robotData.position.y})</p>
            <p><strong>Battery:</strong> <span style="color:${batteryColor}">${battery}%</span></p>
            <p><strong>Status:</strong> <span class="${robotData.status.toLowerCase()}">${robotData.status}</span></p>
            <p><strong>Connection:</strong> <span class="status-badge ${robotData.connection_status || 'connected'}">${robotData.connection_status || 'connected'}</span></p>
        `;
        const msgDiv = document.getElementById('robotStatusMsg');
        if (robotData.status === 'MOVING') msgDiv.innerHTML = '<span class="moving">Robot is moving...</span>';
        else if (robotData.status === 'STUCK') msgDiv.innerHTML = '<span class="stuck">Robot is stuck! Use reset or move to another cell.</span>';
        else if (robotData.status === 'LOW_BATTERY') msgDiv.innerHTML = '<span class="stuck">Low battery! Return to (0,0) to charge.</span>';
        else msgDiv.innerHTML = '<span class="idle">Robot idle.</span>';

        // low batt
        const alertDiv = document.getElementById('batteryAlert');
        if (battery < 20) alertDiv.innerHTML = '<div class="battery-warning">LOW BATTERY! Return to (0,0) to recharge.</div>';
        else alertDiv.innerHTML = '';

        drawMap();
    }

    // websocket
    function connectWebSocket() {
        if (webSocket) webSocket.close();
        if (!token) return;
        webSocket = new WebSocket(WS_URL);
        webSocket.onopen = () => console.log('WebSocket connected');
        webSocket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            robotData = data;
            updateUI();
        };
        webSocket.onerror = (err) => console.error('WebSocket error', err);
        webSocket.onclose = () => {
            console.log('WebSocket disconnected, reconnecting in 2s');
            setTimeout(connectWebSocket, 2000);
        };
    }

    // reset
    async function resetRobot() {
        if (!token || (currentUser && currentUser.role !== 'commander')) { alert('Commander role required'); return; }
        try {
            await apiCall('/robot/reset', { method: 'POST' });
            alert('Reset successful');
            await fetchMap();
        } catch (err) { alert('Reset failed: ' + err.message); }
    }

    // move bot
    async function moveRobot() {
        if (!token || (currentUser && currentUser.role !== 'commander')) { alert('Commander role required'); return; }
        const x = parseInt(document.getElementById('x').value);
        const y = parseInt(document.getElementById('y').value);
        if (isNaN(x) || isNaN(y) || x<0 || x>20 || y<0 || y>20) { alert('Coordinates 0-20'); return; }
        try {
            await apiCall('/robot/move', { method: 'POST', body: JSON.stringify({x,y}) });
            document.getElementById('moveFeedback').innerHTML = '<span style="color:green">Command sent!</span>';
            setTimeout(() => document.getElementById('moveFeedback').innerHTML = '', 2000);
        } catch (err) { alert('Move failed: ' + err.message); }
    }

    // cmd history modal
    async function showHistory() {
        try {
            const logs = await apiCall('/audit/commands');
            const tbody = document.getElementById('historyBody');
            tbody.innerHTML = '';
            logs.forEach(log => {
                const row = tbody.insertRow();
                row.insertCell(0).innerText = new Date(log.timestamp).toLocaleString();
                row.insertCell(1).innerText = log.username;
                row.insertCell(2).innerText = log.command_type;
                row.insertCell(3).innerText = log.command_data;
                row.insertCell(4).innerText = log.success ? 'yes' : 'no';
            });
            document.getElementById('historyModal').style.display = 'block';
        } catch (err) { alert('Failed to load history: ' + err.message); }
    }

    // auth
    async function login() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        try {
            const data = await apiCall('/login', { method: 'POST', body: JSON.stringify({username, password}) });
            token = data.access_token;
            localStorage.setItem('token', token);
            await startApp();
        } catch (err) { document.getElementById('authMessage').innerHTML = `<span style="color:red">Login failed: ${err.message}</span>`; }
    }

    async function register() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const role = document.getElementById('regRole').value;
        if (!username || !password) { alert('Enter username/password'); return; }
        try {
            await apiCall('/register', { method: 'POST', body: JSON.stringify({username, password, email: `${username}@test.com`, role}) });
            document.getElementById('authMessage').innerHTML = '<span style="color:green">Registration successful! Now login.</span>';
        } catch (err) { document.getElementById('authMessage').innerHTML = `<span style="color:red">Registration failed: ${err.message}</span>`; }
    }

    function logout() {
        localStorage.removeItem('token');
        token = null;
        if (webSocket) webSocket.close();
        currentUser = null;
        document.getElementById('authPanel').style.display = 'block';
        document.getElementById('userInfo').style.display = 'none';
        document.getElementById('moveBtn').disabled = true;
        document.getElementById('resetBtn').disabled = true;
        document.getElementById('statusDisplay').innerHTML = 'Please login.';
        document.getElementById('mapContainer').innerHTML = '';
        document.getElementById('robotStatusMsg').innerHTML = '';
    }

    async function startApp() {
        try {
            const user = await apiCall('/user/me');
            currentUser = user;
            document.getElementById('displayUsername').innerText = user.username;
            document.getElementById('displayRole').innerText = user.role;
            document.getElementById('userInfo').style.display = 'flex';
            document.getElementById('authPanel').style.display = 'none';
            if (user.role === 'commander') {
                document.getElementById('moveBtn').disabled = false;
                document.getElementById('resetBtn').disabled = false;
                document.getElementById('roleWarning').innerHTML = '';
            } else {
                document.getElementById('moveBtn').disabled = true;
                document.getElementById('resetBtn').disabled = true;
                document.getElementById('roleWarning').innerHTML = 'Viewer role - cannot control robot.';
            }
            await fetchMap();
            connectWebSocket();
        } catch (err) { logout(); }
    }

    // event lsitener
    document.getElementById('refreshBtn').onclick = fetchMap;
    document.getElementById('resetBtn').onclick = resetRobot;
    document.getElementById('moveBtn').onclick = moveRobot;
    document.getElementById('loginBtn').onclick = login;
    document.getElementById('registerBtn').onclick = register;
    document.getElementById('logoutBtn').onclick = logout;
    document.getElementById('historyBtn').onclick = showHistory;
    document.getElementsByClassName('close')[0].onclick = () => document.getElementById('historyModal').style.display = 'none';
    window.onclick = (e) => { if (e.target === document.getElementById('historyModal')) document.getElementById('historyModal').style.display = 'none'; };

    // initial load
    if (token) startApp().catch(() => logout());
    else { document.getElementById('authPanel').style.display = 'block'; document.getElementById('moveBtn').disabled = true; document.getElementById('resetBtn').disabled = true; }
</script>
</body>
</html>
